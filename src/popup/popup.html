<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Discord Video Hide</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <img src="../../icons/icon48.png" width="32" height="32" alt="">
        <div>
          <h1>Discord Video Hide</h1>
          <p>Choose how hidden cameras look.</p>
        </div>
      </header>

      <fieldset>
        <legend>Hide mode</legend>
        <label><input type="radio" name="mode" value="blur"> Blur</label>
        <label><input type="radio" name="mode" value="black"> Full black</label>
      </fieldset>

      <section id="blur-section">
        <div class="dvh-row">
          <label for="blur-strength">Blur strength</label>
          <output id="blur-value" for="blur-strength">40 px</output>
        </div>
        <input id="blur-strength" type="range" min="8" max="80" step="1">
        <div id="blur-preview" aria-label="Blur preview"><span>Preview</span></div>
      </section>

      <fieldset>
        <legend>Button visibility</legend>
        <label><input type="radio" name="buttonVisibility" value="hover"> On hover</label>
        <label><input type="radio" name="buttonVisibility" value="always"> Always</label>
      </fieldset>

      <section>
        <div class="dvh-row">
          <h2>Currently hidden</h2>
          <button id="show-all" class="dvh-text-button" type="button">Show all</button>
        </div>
        <p id="empty-state">No hidden participants.</p>
        <ul id="hidden-list" aria-live="polite"></ul>
      </section>

      <footer>
        <label><input id="debug" type="checkbox"> Debug mode</label>
        <span id="status" role="status" aria-live="polite"></span>
      </footer>
    </main>
    <script src="../shared/constants.js"></script>
    <script src="../shared/storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
